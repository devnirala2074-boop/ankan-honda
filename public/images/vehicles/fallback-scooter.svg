  </defs>
  <rect width="800" height="520" fill="url(#scooterStudio)"/>
  <ellipse cx="400" cy="432" rx="240" ry="20" fill="#000000" fill-opacity="0.14"/>
  <ellipse cx="400" cy="432" rx="165" ry="11" fill="#000000" fill-opacity="0.22"/>
