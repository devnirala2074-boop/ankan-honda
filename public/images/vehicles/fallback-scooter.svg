<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" fill="none">
  <defs>
    <radialGradient id="scooterStudio" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#ECEEF2"/>
    </radialGradient>
    <linearGradient id="scooterRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E00000"/>
      <stop offset="100%" stop-color="#990000"/>
    </linearGradient>
    <linearGradient id="scooterCharcoal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2B2E34"/>
      <stop offset="100%" stop-color="#15171A"/>
